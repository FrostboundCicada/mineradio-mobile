name:Build Mobile Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发

jobs:
  # =============== iOS 构建 ===============
  build-ios:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 安装依赖
        run: npm ci

      - name: 构建 Web 端
        run: npm run build

      - name: 同步 Capacitor iOS
        run: npx cap sync ios

      - name: 设置 Xcode 版本
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: 导入签名证书（如果有）
        # 如果你没有付费开发者账号，可以跳过这一步，使用下面的“无签名构建”
        if: ${{ secrets.IOS_CERTIFICATE_BASE64 && secrets.IOS_PROVISION_PROFILE_BASE64 }}
        env:
          CERT_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          PROVISION_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          # 创建临时钥匙串
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain

          # 导入证书
          echo "$CERT_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign

          # 导入描述文件
          echo "$PROVISION_BASE64" | base64 --decode > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: 使用 Xcode 构建（带签名）
        if: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -derivedDataPath build \
            -allowProvisioningUpdates \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="你的描述文件名称"  # 请替换或留空

      - name: 使用 Xcode 构建（无签名，仅限模拟器）
        if: ${{ !secrets.IOS_CERTIFICATE_BASE64 }}
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: 打包 .app 为 .ipa（需要签名时才有效）
        if: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        run: |
          mkdir -p Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r app.ipa Payload

      - name: 上传 iOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: |
            app.ipa
            ios/App/build/Build/Products/*.app  # 如果没签名，会传 .app

  # =============== Android 构建 ===============
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 安装依赖
        run: npm ci

      - name: 构建 Web 端
        run: npm run build

      - name: 同步 Capacitor Android
        run: npx cap sync android

      - name: 设置 Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 构建 Android 调试 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 上传 Android 产物
        uses: actions/upload-artifact@v4
        with:
          name: android-app
          path: android/app/build/outputs/apk/debug/*.apk