name: Build iOS App
on: [workflow_dispatch]  # 手动触发
jobs:
  build:
    runs-on: macos-latest  # 必须使用 macOS 环境[reference:19]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install Dependencies
        run: npm install
      - name: Build Web
        run: npm run build
      - name: Sync Capacitor iOS
        run: npx cap sync ios
      - name: Build with Xcode
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO  # 构建未签名的 IPA[reference:20]
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: ios/App/build/Build/Products/Release-iphoneos/*.ipa