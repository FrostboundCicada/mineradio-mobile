name: Build Mobile Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # 使用 Node 22 避免弃用警告

      - run: npm ci
      - run: npm run build
      - run: npm install @capacitor/ios
      - name: Add iOS platform (clean)
        run: |
          rm -rf ios
          npx cap add ios
      - run: npx cap sync ios
      - run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Build iOS (simulator)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          # 修正路径：模拟器构建的 .app 位于 Debug-iphonesimulator 下
          path: ios/App/build/Build/Products/Debug-iphonesimulator/App.app

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci
      - run: npm run build
      - run: npm install @capacitor/android
      - name: Add Android platform (clean)
        run: |
          rm -rf android
          npx cap add android
      - run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app
          path: android/app/build/outputs/apk/debug/*.apk