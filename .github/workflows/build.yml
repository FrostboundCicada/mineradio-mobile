name: Build Mobile Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 手动触发

jobs:
  # ============== iOS 构建 ==============
  build-ios:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # Vite 7 需要 Node 20+

      - name: 安装依赖
        run: npm ci

      - name: 构建 Web 端
        run: npm run build

      - name: 安装 Capacitor iOS 平台
        run: npm install @capacitor/ios

      - name: 添加 iOS 平台
        run: npx cap add ios

      - name: 同步 Capacitor iOS
        run: npx cap sync ios

      - name: 设置 Xcode 版本
        run: sudo xcode-select -switch /Applications/Xcode.app

      # ---- 如果有签名证书（可选） ----
      - name: 导入签名证书（如果有）
        if: ${{ secrets.IOS_CERTIFICATE_BASE64 && secrets.IOS_PROVISION_PROFILE_BASE64 }}
        env:
          CERT_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          PROVISION_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          echo "$CERT_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          echo "$PROVISION_BASE64" | base64 --decode > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      # ---- 有签名：构建 Release IPA ----
      - name: 构建 iOS（带签名）
        if: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -derivedDataPath build \
            -allowProvisioningUpdates \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.IOS_PROVISIONING_PROFILE_SPECIFIER }}"

      - name: 打包 IPA（带签名）
        if: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        run: |
          mkdir -p Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r app.ipa Payload

      # ---- 无签名：构建 Debug .app（仅供模拟器测试） ----
      - name: 构建 iOS（无签名，仅模拟器）
        if: ${{ !secrets.IOS_CERTIFICATE_BASE64 }}
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # ---- 上传产物 ----
      - name: 上传 iOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: |
            app.ipa
            ios/App/build/Build/Products/*.app

  # ============== Android 构建 ==============
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm ci

      - name: 构建 Web 端
        run: npm run build

      - name: 安装 Capacitor Android 平台
        run: npm install @capacitor/android

      - name: 添加 Android 平台
        run: npx cap add android

      - name: 同步 Capacitor Android
        run: npx cap sync android

      - name: 设置 Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 构建 Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 上传 Android 产物
        uses: actions/upload-artifact@v4
        with:
          name: android-app
          path: android/app/build/outputs/apk/debug/*.apk